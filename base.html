<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf" content="{{ csrf_token }}">
  <title>{% block title %}Tunebox{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="top">
  <a class="brand" href="{{ url_for('index') }}">Tunebox</a>
  {% if user %}
  <form class="search" action="{{ url_for('index') }}" method="get" role="search">
    <input type="search" name="q" value="{{ request.args.get('q', '') }}"
           placeholder="Search by title, artist or genre" aria-label="Search songs">
  </form>
  <nav>
    <a class="btn" href="{{ url_for('upload') }}">Upload a song</a>
    <form method="post" action="{{ url_for('logout') }}">
      <input type="hidden" name="csrf" value="{{ csrf_token }}">
      <button class="link">Log out ({{ user.username }})</button>
    </form>
  </nav>
  {% endif %}
</header>
{% with msgs = get_flashed_messages(with_categories=true) %}
  {% if msgs %}<div class="flashes" role="status">
    {% for cat, m in msgs %}<p class="flash {{ cat }}">{{ m }}</p>{% endfor %}
  </div>{% endif %}
{% endwith %}
<main>{% block content %}{% endblock %}</main>
{% block player %}{% endblock %}
</body>
</html>
