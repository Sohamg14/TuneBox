{% extends "base.html" %}
{% block title %}Sign up · Tunebox{% endblock %}
{% block content %}
<section class="card">
  <h1>Create your account</h1>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <label>Username <input name="username" autocomplete="username" required autofocus pattern="[A-Za-z0-9_]{3,20}"></label>
    <label>Password <input name="password" type="password" autocomplete="new-password" minlength="6" required></label>
    <button class="btn">Sign up</button>
  </form>
  <p class="muted">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
</section>
{% endblock %}
